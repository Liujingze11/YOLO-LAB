name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      cuda:
        description: 'Build CUDA version'
        type: boolean
        default: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics pyyaml pyinstaller PySide6

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm packaging/yolo_lab.spec
        env:
          APP_VERSION: ${{ github.ref_name }}

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Create installer
        run: iscc packaging\windows\setup.iss
        env:
          APP_VERSION: ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoloLab-${{ github.ref_name }}-Setup.exe
          path: packaging/dist/YoloLab-${{ github.ref_name }}-Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-shape0 libxcb-cursor0 libfuse2

      - name: Install Python dependencies (CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics pyyaml pyinstaller PySide6

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm packaging/yolo_lab.spec
        env:
          APP_VERSION: ${{ github.ref_name }}

      - name: Build AppImage
        run: bash packaging/linux/build_appimage.sh
        env:
          APP_VERSION: ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoloLab-${{ github.ref_name }}-x86_64.AppImage
          path: packaging/dist/YoloLab-${{ github.ref_name }}-x86_64.AppImage

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics pyyaml pyinstaller PySide6

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm packaging/yolo_lab.spec
        env:
          APP_VERSION: ${{ github.ref_name }}

      - name: Build DMG
        run: bash packaging/macos/build_dmg.sh
        env:
          APP_VERSION: ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoloLab-${{ github.ref_name }}-${{ runner.arch }}.dmg
          path: packaging/dist/YoloLab-${{ github.ref_name }}-*.dmg

  build-gpu-bundle:
    runs-on: ubuntu-latest
    if: ${{ inputs.cuda }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build GPU bundle
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121 --target gpu_bundle
          zip -r gpu_bundle.zip gpu_bundle/

      - name: Upload GPU bundle
        uses: actions/upload-artifact@v4
        with:
          name: gpu_bundle.zip
          path: gpu_bundle.zip

  release:
    needs: [build-windows, build-linux, build-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true
